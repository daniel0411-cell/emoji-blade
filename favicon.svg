<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="fav-g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4757"/>
      <stop offset="100%" stop-color="#ff7f50"/>
    </linearGradient>
    <linearGradient id="fav-g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="fav-g3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="fav-g4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer Dark Base for High Contrast on both Light & Dark Browser Tabs -->
  <circle cx="32" cy="32" r="31" fill="#0f172a" />
  
  <!-- 4 Spinning Curved Blades -->
  <g filter="url(#fav-glow)">
    <path d="M32 32 L32 3 A29 29 0 0 1 57 20 Z" fill="url(#fav-g1)" />
    <path d="M32 32 L61 32 A29 29 0 0 1 44 57 Z" fill="url(#fav-g2)" />
    <path d="M32 32 L32 61 A29 29 0 0 1 7 44 Z" fill="url(#fav-g3)" />
    <path d="M32 32 L3 32 A29 29 0 0 1 20 7 Z" fill="url(#fav-g4)" />
  </g>

  <!-- Center Bit-Chip Core -->
  <circle cx="32" cy="32" r="14.5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.8" />
  
  <!-- Central Flame Emoji Core -->
  <text x="32" y="37.5" font-size="17" text-anchor="middle" dominant-baseline="middle" font-family="Apple Color Emoji, Segoe UI Emoji, sans-serif">🔥</text>
</svg>
