<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640" viewBox="0 0 640 640" role="img" aria-labelledby="title desc"><title id="title">Mirrored launch directions</title><desc id="desc">P1 at minus 35 degrees and P2 at minus 145 degrees, both at 70 percent power. Arrows show direction, not trajectories.</desc><rect width="640" height="640" rx="12" fill="#0c1424"/><g font-family="Arial,sans-serif" fill="#edf3ff" font-size="32" text-anchor="middle"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#67e8f9"/></marker></defs><text x="320" y="45">MIRRORED LAUNCH</text><circle cx="320" cy="320" r="205" fill="#142239" stroke="#64748b" stroke-width="4"/><circle cx="213.4" cy="320" r="26" fill="#0369a1"/><path d="M213.4,320 L311.698,251.171" stroke="#67e8f9" stroke-width="6" marker-end="url(#arrow)"/><text x="213.4" y="367">P1</text><text x="213.4" y="405">-35°</text><text x="213.4" y="438">70%</text><circle cx="426.6" cy="320" r="26" fill="#0369a1"/><path d="M426.6,320 L328.302,251.171" stroke="#67e8f9" stroke-width="6" marker-end="url(#arrow)"/><text x="426.6" y="367">P2</text><text x="426.6" y="405">-145°</text><text x="426.6" y="438">70%</text><path d="M320,191 L390,191 M320,191 L320,121" stroke="#67e8f9" stroke-width="3" marker-end="url(#arrow)"/><text x="425" y="199" font-size="28">0°</text><text x="320" y="104" font-size="28">-90°</text><text x="320" y="570">Initial directions only</text><text x="320" y="610" font-size="28">Trial settings, not an optimal route</text></g></svg>